name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same branch makes the previous run irrelevant. Cancelling it keeps
# feedback fast and does not burn minutes on results nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.12'

jobs:
  # Path filtering without a third-party action: on a pull request only the affected
  # toolchain runs; on main everything runs, because that is what gets deployed.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "push to main: running everything"
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only "$base"...HEAD)
          echo "changed files:"
          echo "$changed"

          # Shared files (workflows, task runner, docs that gate a job) run both sides.
          if echo "$changed" | grep -qE '^(apps/web/|package\.json|package-lock\.json|scripts/|\.github/workflows/)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$changed" | grep -qE '^(apps/api/|content/|\.github/workflows/)'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi

  web-quality:
    name: web · lint, types, contrast, tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Types
        run: npm run typecheck

      # Reads the real token values and fails below WCAG thresholds, so a palette tweak
      # cannot quietly make text unreadable in one of the two themes.
      - name: Contrast
        run: npm run check:contrast

      - name: Unit tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Bundle size
        run: |
          js=$(find dist/assets -name '*.js' -exec gzip -c {} \; | wc -c)
          css=$(find dist/assets -name '*.css' -exec gzip -c {} \; | wc -c)
          echo "JS  gzip: $((js / 1024)) kB (budget 180 kB)"
          echo "CSS gzip: $((css / 1024)) kB (budget 30 kB)"
          if [ "$js" -gt 184320 ]; then echo "::error::JS bundle over budget"; exit 1; fi
          if [ "$css" -gt 30720 ]; then echo "::error::CSS bundle over budget"; exit 1; fi

  api-quality:
    name: api · lint, types, tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    # A real MongoDB, not a mock. Unique constraints, TTL indexes and compound index shapes
    # only exist in the server, so a mocked database would only prove the mock works.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # uv comes from pip rather than a third-party action: one less external dependency
      # in the supply chain for a tool that installs everything else.
      - name: Install uv
        run: python -m pip install --quiet uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy src tests

      - name: Tests
        run: uv run pytest
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017

      # Gates content pull requests without a database: a malformed project fails here
      # rather than appearing broken in production.
      - name: Validate content
        run: uv run python -m portfolio_api.seed --check

  e2e:
    name: e2e · playwright
    needs: [changes, web-quality]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      # The Playwright config builds and serves the production bundle itself, so this
      # exercises what actually ships rather than the dev server.
      - name: Run end-to-end tests
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  security:
    name: security · secrets and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scans full history, not just the diff: a secret committed and later removed is
      # still a leaked secret.
      - name: Scan for committed secrets
        run: |
          version=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner --redact --exit-code 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit npm dependencies
        working-directory: apps/web
        run: npm audit --audit-level=high

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Audit Python dependencies
        working-directory: apps/api
        run: |
          python -m pip install --quiet uv
          uv export --format requirements-txt --no-hashes --no-emit-project > /tmp/requirements.txt
          uvx pip-audit --requirement /tmp/requirements.txt

  # Single required status check. Path-filtered jobs report "skipped", which would block a
  # merge forever if each were required individually; this gate treats skipped as fine and
  # only fails when something actually failed.
  ci:
    name: ci
    if: always()
    needs: [web-quality, api-quality, e2e, security]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for result in $results; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::a required job did not pass"
              exit 1
            fi
          done
          echo "all jobs passed or were skipped"
